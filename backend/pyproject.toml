[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yk", email = "yk226580@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uvicorn]
app = "app.main:app"
host = "127.0.0.1"
port = 8000
reload = true

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"

include = ["app/**/*.py", "tests/**/*.py"]

exclude = [
    "build",
    "dist",
    "app/generated",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D103"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true

files = ["app", "tests"]

exclude = [
    "migrations/",
    "build/",
    "dist/",
    "app/generated/.*",
]

[[tool.mypy.overrides]]
# 对特定模块进一步放宽检查
module = ["tests.*"]
disallow_untyped_defs = false
