[project]
name = "harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yk", email = "yk226580@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.4",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# ---------------------------------- Ruff -------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".idea",
    "deploy",
    "docs",
    "frontend",
]
force-exclude = true            # 显式传入被排除目录时同样跳过

[tool.ruff.lint]
select = [
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "F",   # Pyflakes
    "I",   # isort 导入排序
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # 行长交给 ruff format / line-length 处理
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]  # backend.* 视为第一方模块

# ---------------------------------- mypy -------------------------------------
[tool.mypy]
files = ["backend"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
python_version = "3.12"
plugins = ["pydantic.mypy"]      # 支持 Pydantic / pydantic-settings 模型的类型检查

strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["backend.tests.*"]
disallow_untyped_defs = false    # 测试函数允许省略返回注解

[tool.pytest.ini_options]
pythonpath = ["."]
